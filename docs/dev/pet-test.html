<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>黑白熊像素测试</title>
<style>
  body { background:#0E0F13; color:#fff; font-family:monospace; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
  .cell { background:#1a1c22; border:1px solid #333; padding:8px; text-align:center; }
  .cell canvas { display:block; margin:0 auto 6px; }
  .cell span { font-size:11px; color:#aaa; }
</style>
</head>
<body>
<h3>动作帧</h3>
<div class="row" id="frames"></div>
<h3>皮肤</h3>
<div class="row" id="skins"></div>
<h3>道具帧</h3>
<div class="row" id="props"></div>
<script src="pet.js"></script>
<script>
  function mk(parent, label, opts) {
    var cell = document.createElement('div'); cell.className = 'cell';
    var cv = document.createElement('canvas'); cv.setAttribute('data-scale', '6');
    var sp = document.createElement('span'); sp.textContent = label;
    cell.appendChild(cv); cell.appendChild(sp);
    document.getElementById(parent).appendChild(cell);
    MonokumaPet.draw(cv, opts);
  }
  ['stand','blink','walkA','walkB','sit','sleep','happy','giggle','angry','eat','back'].forEach(function(f){
    mk('frames', f, { frame: f, skin: 'classic' });
  });
  Object.keys(MonokumaPet.SKINS).forEach(function(s){
    mk('skins', s, { frame: 'stand', skin: s });
  });
  mk('props', 'eat+碗', { frame:'eat', skin:'classic', props:[{name:'bowl',dx:4,dy:16}] });
  mk('props', 'sleep+Z', { frame:'sleep', skin:'classic', props:[{name:'zzz',dx:13,dy:-2}] });
  mk('props', 'giggle+心', { frame:'giggle', skin:'classic', props:[{name:'heart',dx:13,dy:0}] });
  mk('props', 'angry+💢', { frame:'angry', skin:'classic', props:[{name:'anger',dx:14,dy:-1}] });
  mk('props', '水杯', { frame:'sit', skin:'classic', props:[{name:'cup',dx:6,dy:14}] });
</script>
</body>
</html>
